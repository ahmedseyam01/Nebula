<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#2a0a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f5d78e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5d78e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="170" fill="url(#glow)"/>
  <g fill="none" stroke="#f5d78e" stroke-width="5" stroke-linejoin="round" transform="translate(200 180)">
    <rect x="-80" y="-80" width="160" height="160"/>
    <rect x="-80" y="-80" width="160" height="160" transform="rotate(45)"/>
    <circle r="46" stroke-width="3" opacity="0.7"/>
  </g>
  <text x="200" y="196" text-anchor="middle" font-family="Noto Kufi Arabic, Amiri, serif" font-size="40" font-weight="700" fill="#f5d78e">قرآن</text>
  <text x="200" y="345" text-anchor="middle" font-family="Noto Kufi Arabic, Amiri, serif" font-size="34" fill="#fdf3d8" opacity="0.9">القرآن الكريم</text>
</svg>
